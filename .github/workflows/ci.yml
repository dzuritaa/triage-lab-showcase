name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit SHA, not a mutable tag: a tag can be
      # repointed at new code by whoever controls the repo.
      - name: Checkout # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # Run gitleaks via its container rather than the marketplace action:
      # no license key, and one less third-party action in the supply chain.
      # Pinned by digest so the tag cannot be moved under us.
      - name: gitleaks # zricethezav/gitleaks v8.28.0
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact --verbose
