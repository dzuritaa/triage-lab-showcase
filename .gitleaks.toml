# Secret-scanner config.
#
# The default ruleset does NOT cover Anthropic keys — verified by planting a
# realistically-shaped key and watching a stock scan report "no leaks found".
# The rule below is the one that actually protects this project's credential.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{80,120}'''
keywords = ["sk-ant-"]

[allowlist]
description = "Placeholders that are deliberately not key-shaped"
paths = ['''\.env\.example$''']
